# steamac: keep the OS's Steam service and its health/bootstrap hooks.
# steamvr.service is masked at runtime; its stock Wants/After are harmless.
[Unit]
After=gamescope-session.service

[Service]
UnsetEnvironment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST STEAM_DESKTOP_APP_AFFINITY_LIST
# KosmicKrisp implements unsigned min/max only, not every 64-bit atomic. Keep
# those features out of vkd3d-proton's default caps; DD2 opts back in per title.
# This must be inherited from Steam: steam-launch-wrapper unconditionally
# overwrites variables listed in gfx.txt, even a title's launch-option values.
# An explicit stock/user gfx.txt entry still wins and is deliberately left alone.
Environment=VKD3D_DISABLE_EXTENSIONS=VK_KHR_shader_atomic_int64,VK_EXT_shader_image_atomic_int64
TimeoutStopSec=10
# These run after the stock ExecStartPre commands (including its cp -u).
ExecStartPre=/usr/lib/steamac/steam-client
# Bound the first host sync, then use one snapshot throughout this Steam start.
ExecStartPre=-/usr/lib/steamac/steam-profiles-wait
# Register only an active virtiofs share, once per path; user removals in Steam stay removed.
ExecStartPre=-/usr/lib/steamac/steam-share-library
ExecStartPre=-/usr/lib/steamac/steam-gfx-env
# Allow DXMT: install its Proton payload, but map only games whose profile requests it.
ExecStartPre=-/usr/lib/steamac/steam-gfx-path
ExecStartPre=-/usr/lib/steamac/steam-shader-defaults
# Steam's idle screensaver off once per install: after a few minutes without input Steam sees
# (a long load, VR) it takes focus from the game (a later choice in Steam stays)
ExecStartPre=-/usr/lib/steamac/steam-idle-screensaver
ExecStartPre=-/usr/lib/steamac/mac-clock-format
ExecStartPre=-/usr/lib/steamac/steam-title-defaults
ExecStartPost=/usr/lib/steamac/steam-client --watch $MAINPID
